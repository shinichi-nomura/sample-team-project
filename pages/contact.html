                    <nav class="nav-menu">
                        <ul class="nav-list">
                            <li class="nav-1">

                                </a>
                            </li>

                    </nav>
                </div>
            </div>
        </header>
        <section class="contact-form">
            <img src="../images/more-images/Frame 138.png" class="contact-background">
            <form class="contact" id="contactForm">
                <div class="contact-title">
                    <h2>お問い合わせ<br>お仕事依頼</h2>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <div class="field">
                            <div class="label-row">
                                <label for="contact-lastName">苗字</label>
                                <span class="required">必須</span>
                            </div>
                            <input type="text" id="lastName" name="name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="field">
                            <div class="label-row">
                                <label for="contact-firstName">お名前</label>
                                <span class="required">必須</span>
                            </div>
                            <input type="text" id="firstName" name="name" required>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <div class="field">
                            <div class="label-row">
                                <label for="contact-lastName">みょうじ</label>
                                <span class="required">必須</span>
                            </div>
                            <input type="text" id="lastName-check" name="name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="field">
                            <div class="label-row">
                                <label for="contact-firstName">おなまえ</label>
                                <span class="required">必須</span>
                            </div>
                            <input type="text" id="firstName-check" name="name" required>
                        </div>
                    </div>
                </div>
                <div class="form-group mail full-group">
                    <div class="label-row">
                        <label for="contact-email">メールアドレス</label>
                        <span class="required">必須</span>
                    </div>
                    <input type="email" id="contact-email" name="email" required>
                </div>
                <div class="form-group mail-r full-group">
                    <div class="label-row">
                        <label for="email-check">メールアドレス(確認)</label>
                        <span class="required">必須</span>
                    </div>
                    <input type="email" id="email-check" name="email" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <div class="field">
                            <label for="contact-tell">電話番号</label>
                            <input type="text" id="contact-tell" name="phone">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="field">
                            <label for="contact-phone">携帯電話番号</label>
                            <input type="text" id="contact-phone" name="phone">
                        </div>
                    </div>
                </div>
                <div class="address-group">
                    <label class="address-title">住所</label>
                    <div class="zip-row">
                        <span class="zip-mark">〒</span>
                        <input type="text" id="contact-address" name="postalCode" class="zip-input">
                        <button type="button" class="address-search">
                            住所検索
                        </button>
                    </div>
                    <div class="address-item">
                        <label for="prefecture">都道府県</label>
                        <select id="prefecture" name="prefecture">
                            <option>選択してください</option>
                        </select>
                    </div>
                    <div class="address-item">
                        <label for="municipality">市区町村番地</label>
                        <input type="text" id="municipality" name="municipality">
                    </div>
                    <div class="address-item">
                        <label for="building">建物・部屋名</label>
                        <input type="text" id="building" name="building">
                    </div>
                </div>
                <div class="form-group details">
                    <div class="label-row">
                        <label for="contact-details">内容</label>
                        <span class="required">必須</span>
                    </div>
                    <textarea id="contact-details" name="details" required></textarea>
                </div>
                <div class="decision-button">
                    <button type="submit" class="decision">決定</button>
                </div>
            </form>
        </section>

                    height="77" />
                <img src="../images/top-images/PC-SNSアイコン-1.png" class="sns-icon" alt="Xアイコン" width="77" height="77" />
                <img src="../images/top-images/PC-SNSアイコン-2 (1).png" class="sns-icon" alt="TikTokアイコン" width="77"
                    height="77" />

                <img src="../images/top-images/PC-SNSアイコン-4.png" class="sns-icon" alt="facebookアイコン" width="77"

            </div>

                <a href="">プライバシーポリシー</a>

            </div>
        </footer>
        <script src="../js/main.js"></script>
    </div>

</html>
