        <section class="contact-form contact-page-animation-pending">
            <img src="../images/more-images/Otoiawase.webp" class="contact-background" width="2880" height="6364" />
            <form class="contact" id="contactForm" novalidate>
                <div class="contact-title">
                    <h2>お問い合わせ<br>お仕事依頼</h2>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <div class="field">
                            <div class="label-row">
                                <label for="lastName">苗字</label>
                                <span class="required">必須</span>
                            </div>
                            <input required type="text" id="lastName" name="lastName">
                            <p class="error-message"></p>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="field">
                            <div class="label-row">
                                <label for="firstName">お名前</label>
                                <span class="required">必須</span>
                            </div>
                            <input required type="text" id="firstName" name="firstName">
                            <p class="error-message"></p>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <div class="field">
                            <div class="label-row">
                                <label for="lastName-check">みょうじ</label>
                                <span class="required">必須</span>
                            </div>
                            <input required type="text" id="lastName-check" name="lastName-kana">
                            <p class="error-message"></p>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="field">
                            <div class="label-row">
                                <label for="firstName-check">おなまえ</label>
                                <span class="required">必須</span>
                            </div>
                            <input required type="text" id="firstName-check" name="firstName-kana">
                            <p class="error-message"></p>
                        </div>
                    </div>
                </div>
                <div class="form-group mail full-group">
                    <div class="label-row">
                        <label for="email">メールアドレス</label>
                        <span class="required">必須</span>
                    </div>
                    <input required type="email" id="email" name="email">
                    <p class="error-message"></p>
                </div>
                <div class="form-group mail-r full-group">
                    <div class="label-row">
                        <label for="email-check">メールアドレス(確認)</label>
                        <span class="required">必須</span>
                    </div>
                    <input required type="email" id="email-check" name="email-check">
                    <p class="error-message"></p>
                </div>
                <div class="form-group company-group full-group">
                    <label for="company">会社名</label>
                    <input type="text" id="company" name="company" autocomplete="organization">
                </div>
                <div class="form-row tell-section">
                    <div class="form-group">
                        <div class="field">
                            <label for="contact-tell">電話番号</label>
                            <input type="tel" id="contact-tell" name="tel" inputmode="tel">
                            <p class="error-message"></p>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="field">
                            <label for="contact-phone">携帯電話番号</label>
                            <input type="tel" id="contact-phone" name="phone" inputmode="tel">
                            <p class="error-message"></p>
                        </div>
                    </div>
                </div>
                <div class="address-group">
                    <label class="address-title">住所</label>
                    <div class="zip-field">
                        <div class="zip-row">
                            <span class="zip-mark">〒</span>
                            <input type="text" id="contact-address" name="postalCode" class="zip-input"
                                inputmode="numeric">
                            <button type="button" class="address-search">
                                住所検索
                            </button>
                        </div>
                        <p class="error-message zip-error"></p>
                    </div>
                    <div class="address-item">
                        <label for="prefecture">都道府県</label>
                        <select id="prefecture" name="prefecture">
                            <option>選択してください</option>
                            <option value="北海道">北海道</option>
                            <option value="青森県">青森県</option>
                            <option value="岩手県">岩手県</option>
                            <option value="宮城県">宮城県</option>
                            <option value="秋田県">秋田県</option>
                            <option value="山形県">山形県</option>
                            <option value="福島県">福島県</option>
                            <option value="茨城県">茨城県</option>
                            <option value="栃木県">栃木県</option>
                            <option value="群馬県">群馬県</option>
                            <option value="埼玉県">埼玉県</option>
                            <option value="千葉県">千葉県</option>
                            <option value="東京都">東京都</option>
                            <option value="神奈川県">神奈川県</option>
                            <option value="新潟県">新潟県</option>
                            <option value="富山県">富山県</option>
                            <option value="石川県">石川県</option>
                            <option value="福井県">福井県</option>
                            <option value="山梨県">山梨県</option>
                            <option value="長野県">長野県</option>
                            <option value="岐阜県">岐阜県</option>
                            <option value="静岡県">静岡県</option>
                            <option value="愛知県">愛知県</option>
                            <option value="三重県">三重県</option>
                            <option value="滋賀県">滋賀県</option>
                            <option value="京都府">京都府</option>
                            <option value="大阪府">大阪府</option>
                            <option value="兵庫県">兵庫県</option>
                            <option value="奈良県">奈良県</option>
                            <option value="和歌山県">和歌山県</option>
                            <option value="鳥取県">鳥取県</option>
                            <option value="島根県">島根県</option>
                            <option value="岡山県">岡山県</option>
                            <option value="広島県">広島県</option>
                            <option value="山口県">山口県</option>
                            <option value="徳島県">徳島県</option>
                            <option value="香川県">香川県</option>
                            <option value="愛媛県">愛媛県</option>
                            <option value="高知県">高知県</option>
                            <option value="福岡県">福岡県</option>
                            <option value="佐賀県">佐賀県</option>
                            <option value="長崎県">長崎県</option>
                            <option value="熊本県">熊本県</option>
                            <option value="大分県">大分県</option>
                            <option value="宮崎県">宮崎県</option>
                            <option value="鹿児島県">鹿児島県</option>
                            <option value="沖縄県">沖縄県</option>
                        </select>
                    </div>
                    <div class="address-item">
                        <label for="municipality">市区町村番地</label>
                        <input type="text" id="municipality" name="municipality">
                    </div>
                    <div class="address-item">
                        <label for="building">建物・部屋名</label>
                        <input type="text" id="building" name="building">
                    </div>
                </div>
                <div class="form-group details">
                    <div class="label-row">
                        <label for="contact-details">内容</label>
                        <span class="required">必須</span>
                    </div>
                    <div class="textarea-wrapper">
                        <textarea required id="contact-details" name="details"></textarea>
                        <p class="error-message"></p>
                    </div>
                </div>
                <div class="decision-button">
                    <button type="submit" class="decision">決定</button>
                    <p class="form-status" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>
