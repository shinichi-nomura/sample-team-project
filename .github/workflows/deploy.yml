name: Publish website (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ftps
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test deployment safeguards
        run: python3 -m unittest discover -s tests -p 'test_deploy.py'
      - name: Test contact handler without sending mail
        run: |
          php -l pages/contact-send.php
          php tests/contact_test.php
          php -l pages/site-security.php
          php -l pages/cms-feed.php
          php tests/security_test.php
      - name: Test social link previews
        run: node tests/article_link_preview.test.js
      - name: Upload public files using FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: python3 scripts/deploy.py
