name: Emergency website lockdown

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-lockdown.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ftps
  cancel-in-progress: false

jobs:
  lockdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Deny production web requests using FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/emergency_lockdown.py
